name: Tunesmith desktop app

# Tests Tunesmith on every change to it, and builds installers for macOS, Windows
# and Linux when run by hand (Actions → Tunesmith desktop app → Run workflow).
on:
  push:
    paths: ['tunesmith/**', '.github/workflows/tunesmith-desktop.yml']
  pull_request:
    paths: ['tunesmith/**', '.github/workflows/tunesmith-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tunesmith
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tunesmith/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tunesmith
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tunesmith/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Tunesmith-${{ runner.os }}
          path: |
            tunesmith/dist/*.dmg
            tunesmith/dist/*.exe
            tunesmith/dist/*.AppImage
          if-no-files-found: error
